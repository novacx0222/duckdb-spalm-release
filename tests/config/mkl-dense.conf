# Path to the directory containing the spalm shared library.
# The extension will automatically find the first *.so file in this directory.
# Override config file location with the SPALM_CONF environment variable.
so_dir = spalm-release/bin

# Optional key/value arguments forwarded directly to spalm.
# Threads are always set automatically from DuckDB's thread count
# (use  SET threads = N;  in DuckDB to change it).
#
init_method = FORCE_MKL_DENSE
